<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06C755">
<meta property="og:title" content="つなぐ">
<meta property="og:description" content="仕事探しを、友達の紹介で。">
<title>つなぐ - 仕事探しを、友達の紹介で。</title>
<!--
  試作プロトタイプにつき、以下を意図的に省略しています。
  - 本物のプッシュ通知: 「決まった！」を押しても実際には誰にも通知が飛ばず、画面内トーストのみ。本格対応はサーバー側でFCM/LINE Notify等を叩く入口を作る。
  - サーバー保存・端末間同期: 全データはブラウザのlocalStorageのみ。端末を変えると消え、紹介した人・支援者・求職者の3者間で状態が自動同期しない
    （相手の操作で状態が変わるのは同じ端末で試したときだけ）。本格対応はAPIサーバー+DB(例: Firestore)に置き換える。
  - 認証: 誰でも「自分のカードを作る」ができ、本人確認なし。本格対応はLINEログイン等のOAuthで支援者を認証する。
  - 紹介者名(&by=)の発行: 紹介する人自身の名前を入力する導線が無いため、リンクに&by=を載せる処理は未実装（受け取り側のデコードのみ実装済み）。
    本格対応は紹介する人のプロフィール入力欄を追加し、リンク生成時にencodeTextParamで載せる。
  - 「紹介されてきた人」一覧: 支援する人が自分のカードを配ったあと、実際に別端末で紹介が発生してもこの端末には届かない。
    今は同じ端末内でmyCardが紹介リストに入っている場合のみ表示できる。本格対応はサーバー側で紹介レコードを支援者IDに紐付けて配信する。
-->
<style>
  :root{
    --accent:#06C755;
    --bg:#ffffff;
    --fg:#1a1a1a;
    --sub:#6b6b6b;
    --line:#e6e6e6;
    --card:#f7f7f7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:#eeeeee;
    color:var(--fg);
    font-size:14px;
    line-height:1.6;
  }
  #app{
    max-width:430px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  header.app-header{
    padding:18px 16px 14px;
    border-bottom:1px solid var(--line);
    background:var(--bg);
    position:sticky;
    top:0;
    z-index:10;
  }
  header.app-header h1{
    margin:0;
    font-size:20px;
    font-weight:700;
  }
  header.app-header p{
    margin:4px 0 0;
    font-size:13px;
    color:var(--sub);
  }
  main{
    flex:1;
    padding:16px;
    padding-bottom:40px;
  }
  .view{display:none;}
  .view.active{display:block;}
  .view-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .view-head .help-link{
    font-size:20px;
    text-decoration:none;
    color:var(--sub);
    border:1px solid var(--line);
    border-radius:50%;
    width:30px;
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    margin-bottom:14px;
  }
  .card h3{
    margin:0 0 6px;
    font-size:16px;
  }
  .card .meta{
    font-size:13px;
    color:var(--sub);
    margin:2px 0;
  }
  .card .comment{
    margin:10px 0;
    font-size:14px;
  }
  .card .stats{
    font-size:12px;
    color:var(--accent);
    font-weight:700;
    margin-top:8px;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    height:48px;
    padding:0 18px;
    border-radius:10px;
    border:none;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    width:100%;
  }
  .btn-primary{
    background:var(--accent);
    color:#fff;
  }
  .btn-secondary{
    background:#fff;
    color:var(--fg);
    border:1px solid var(--line);
  }
  .btn-ghost{
    background:transparent;
    color:var(--sub);
    border:1px solid var(--line);
    height:40px;
    font-size:13px;
    font-weight:600;
  }
  .btn-small{
    height:40px;
    font-size:13px;
    padding:0 10px;
  }
  .btn-row{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  .btn-row .btn{margin:0;}
  label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin:12px 0 6px;
  }
  input[type=text], input[type=url], textarea, select{
    width:100%;
    padding:10px 12px;
    border-radius:8px;
    border:1px solid var(--line);
    font-size:14px;
    font-family:inherit;
    background:#fff;
  }
  textarea{resize:vertical;min-height:70px;}
  .form-box{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    margin-bottom:16px;
  }
  .section-title{
    font-size:15px;
    font-weight:700;
    margin:0 0 10px;
  }
  .divider{
    border:none;
    border-top:1px solid var(--line);
    margin:20px 0;
  }
  .empty{
    text-align:center;
    color:var(--sub);
    padding:24px 10px;
    font-size:13px;
  }
  .empty .hint-actions{
    margin-top:14px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .generated-box{
    background:#fff;
    border:1px dashed var(--accent);
    border-radius:10px;
    padding:12px;
    font-size:13px;
    white-space:pre-wrap;
    margin:10px 0;
  }
  .record-item{
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:8px;
    font-size:13px;
    background:#fff;
  }
  .record-item.celebrate{
    background:#eafff1;
    border-color:var(--accent);
  }
  .record-item .top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .record-item .celebrate-msg{
    color:var(--accent);
    font-weight:700;
    margin-top:6px;
    font-size:13px;
  }
  .status-badge{
    display:inline-block;
    padding:2px 8px;
    border-radius:20px;
    font-size:11px;
    font-weight:700;
    background:var(--card);
    border:1px solid var(--line);
    white-space:nowrap;
  }
  .status-badge.done{background:var(--accent);color:#fff;border-color:var(--accent);}
  .status-select{
    margin-top:8px;
    height:38px;
    font-size:12px;
  }
  .toast{
    position:fixed;
    left:50%;
    bottom:30px;
    transform:translateX(-50%);
    background:#1a1a1a;
    color:#fff;
    padding:10px 18px;
    border-radius:30px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s;
    z-index:100;
    max-width:90%;
    text-align:center;
  }
  .toast.show{opacity:1;}
  .footer-settings{
    margin-top:24px;
    text-align:center;
  }
  .footer-settings button, .link-muted{
    background:none;
    border:none;
    color:var(--sub);
    font-size:12px;
    text-decoration:underline;
    cursor:pointer;
    font-family:inherit;
  }
  a.link-muted{display:inline-block;}
  .hint{
    font-size:12px;
    color:var(--sub);
    margin-top:4px;
  }
  .big-card{
    text-align:center;
    padding:26px 18px;
  }
  .big-card h2{
    margin:6px 0 4px;
    font-size:20px;
  }
  /* 役割選択 */
  .role-intro{
    text-align:center;
    padding:10px 8px 22px;
  }
  .role-intro p{margin:6px 0 0;color:var(--sub);}
  .role-intro .lead{
    margin-top:20px;
    font-weight:700;
    color:var(--fg);
    font-size:15px;
  }
  .role-card{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:4px;
    width:100%;
    min-height:120px;
    text-align:left;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px 18px;
    margin-bottom:14px;
    cursor:pointer;
    font-family:inherit;
  }
  .role-card:active{background:#eee;}
  .role-card .role-emoji{font-size:26px;}
  .role-card .role-title{font-size:16px;font-weight:700;margin-top:4px;}
  .role-card .role-desc{font-size:13px;color:var(--sub);}
  /* トーン切替 */
  .tone-row{
    display:flex;
    gap:8px;
    margin:8px 0 4px;
  }
  .tone-btn{
    flex:1;
    height:38px;
    border-radius:20px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--sub);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }
  .tone-btn.active{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }
</style>
</head>
<body>
<div id="app">
  <header class="app-header">
    <h1>つなぐ</h1>
    <p>仕事探しを、友達の紹介で。</p>
  </header>

  <main>

    <!-- 役割選択 -->
    <section id="view-role" class="view">
      <div class="role-intro">
        <p>はじめまして。</p>
        <p class="lead">どちらで使いますか？</p>
      </div>
      <button class="role-card" id="role-refer">
        <div class="role-emoji">🤝</div>
        <div class="role-title">友達を紹介したい</div>
        <div class="role-desc">仕事を探してる友達を、相談できる人に繋ぐ</div>
      </button>
      <button class="role-card" id="role-support">
        <div class="role-emoji">💼</div>
        <div class="role-title">仕事探しを手伝っている</div>
        <div class="role-desc">自分のカードを作って、紹介してもらう</div>
      </button>
      <div style="text-align:center;margin-top:10px;">
        <a class="link-muted" href="manual.html">使い方を見る</a>
      </div>
    </section>

    <!-- ?add= 確認画面 -->
    <section id="view-add-confirm" class="view">
      <div class="card" style="text-align:center;">
        <div class="meta">支援者カードが届きました</div>
        <h2 id="add-confirm-name" style="margin:8px 0 4px;font-size:19px;"></h2>
        <div class="meta" id="add-confirm-skill"></div>
        <div class="meta" id="add-confirm-area"></div>
        <div class="comment" id="add-confirm-comment"></div>
        <p style="margin-top:14px;font-weight:700;">この人をあなたの紹介リストに追加しますか？</p>
        <button class="btn btn-primary" id="btn-add-confirm-yes">紹介リストに追加する</button>
        <button class="btn btn-ghost" id="btn-add-confirm-no" style="margin-top:8px;width:100%;">今は追加しない</button>
      </div>
    </section>

    <!-- 紹介する人：ホーム -->
    <section id="view-refer-home" class="view">
      <div class="view-head">
        <div class="section-title" style="margin:0;">紹介できる人</div>
        <a class="help-link" href="manual.html" title="使い方を見る">?</a>
      </div>
      <div id="refer-supporter-list"></div>
      <div class="empty" id="refer-empty" style="display:none;">
        まだ紹介できる人がいません<br><br>
        仕事探しを手伝っている知り合いに、<br>カードを作ってもらってください。
        <div class="hint-actions">
          <button class="btn btn-secondary btn-small" id="btn-invite-copy">誘い文をコピー</button>
          <button class="btn btn-ghost" id="btn-try-sample">見本で試す</button>
        </div>
      </div>

      <hr class="divider">
      <div class="section-title">紹介したあと</div>
      <div id="referral-records"></div>

      <div class="footer-settings">
        <button class="btn-change-role">役割を変える</button>
        &nbsp;・&nbsp;
        <button id="btn-reset">データ全消去</button>
      </div>
    </section>

    <!-- 紹介する人：紹介1画面 -->
    <section id="view-refer-detail" class="view">
      <div class="view-head">
        <button class="link-muted" id="btn-refer-back" style="font-size:13px;">← 戻る</button>
      </div>
      <div class="section-title" id="refer-detail-name">紹介する</div>

      <label for="f-friend-name">友達の名前（入れなくてもOK）</label>
      <input type="text" id="f-friend-name" placeholder="例: たかし">

      <label for="refer-detail-text">送る文面（編集できます）</label>
      <textarea id="refer-detail-text" rows="6"></textarea>

      <div class="tone-row">
        <button class="tone-btn active" data-tone="casual">カジュアル</button>
        <button class="tone-btn" data-tone="polite">ていねい</button>
      </div>

      <button class="btn btn-primary" id="btn-refer-line" style="margin-top:14px;background:#06C755;">LINEで送る</button>
      <div class="btn-row">
        <button class="btn btn-secondary btn-small" id="btn-refer-copy">コピー</button>
        <button class="btn btn-secondary btn-small" id="btn-refer-share" style="display:none;">他のアプリで送る</button>
      </div>
    </section>

    <!-- 支援する人：ホーム -->
    <section id="view-support-home" class="view">
      <div class="view-head">
        <div class="section-title" style="margin:0;">自分のカード</div>
        <a class="help-link" href="manual.html" title="使い方を見る">?</a>
      </div>
      <div id="mycard-preview"></div>
      <button class="btn btn-secondary" id="btn-open-mycard-form">カードを編集する</button>

      <div class="form-box" id="mycard-form" style="display:none;">
        <div class="section-title">カードを作る</div>
        <label for="mc-name">名前</label>
        <input type="text" id="mc-name" placeholder="例: 山田 太郎">
        <label for="mc-skill">得意分野</label>
        <input type="text" id="mc-skill" placeholder="例: 20代の転職・未経験IT">
        <label for="mc-area">対応地域</label>
        <input type="text" id="mc-area" placeholder="例: 全国・オンライン">
        <label for="mc-comment">一言</label>
        <textarea id="mc-comment" placeholder="例: まず話を聞くところから"></textarea>
        <label for="mc-line">LINE連絡先URL</label>
        <input type="url" id="mc-line" placeholder="https://line.me/ti/p/xxxx">
        <div class="btn-row">
          <button class="btn btn-secondary" id="btn-cancel-mycard">キャンセル</button>
          <button class="btn btn-primary" id="btn-save-mycard">保存</button>
        </div>
      </div>

      <div id="mycard-distribute" style="display:none;">
        <hr class="divider">
        <div class="section-title">紹介してくれる人に配る</div>
        <button class="btn btn-primary" id="btn-distribute">配布リンクをつくる</button>
        <div id="distribute-generated" style="display:none;">
          <div class="generated-box" id="distribute-text"></div>
          <div class="btn-row">
            <button class="btn btn-secondary btn-small" id="btn-distribute-copy">コピー</button>
            <button class="btn btn-primary btn-small" id="btn-distribute-line">LINEで送る</button>
          </div>
        </div>
      </div>

      <hr class="divider">
      <div class="section-title">紹介されてきた人</div>
      <div id="received-list"></div>

      <div class="footer-settings">
        <button class="btn-change-role">役割を変える</button>
        &nbsp;・&nbsp;
        <button id="btn-reset-2">データ全消去</button>
      </div>
    </section>

    <!-- 仕事を探している人（リンクで来た人） -->
    <section id="view-consult" class="view">
      <div id="consult-area"></div>
    </section>

  </main>

  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "shokai_v1";
  var resetArmed = false;
  var resetArmed2 = false;
  // 公開後のURL。file://で開いたときだけリンク生成に使う（file://のリンクは友達に送っても開けないため）
  var PUBLIC_BASE = "https://ryoseiimai.github.io/tsunagu/";
  var SHORTEN_API = "https://tsunagu.densalon.com/api/shorten";
  var SHORTEN_TIMEOUT_MS = 4000;

  // 短縮API呼び出し。失敗・タイムアウト時は null を返す（呼び出し側で長いURLにフォールバックする）
  function shortenLink(body){
    if(typeof fetch !== "function") return Promise.resolve(null);
    var controller = (typeof AbortController === "function") ? new AbortController() : null;
    var timer = controller ? setTimeout(function(){ controller.abort(); }, SHORTEN_TIMEOUT_MS) : null;
    return fetch(SHORTEN_API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
      signal: controller ? controller.signal : undefined
    }).then(function(res){
      if(!res.ok) return null;
      return res.json();
    }).then(function(json){
      return (json && json.url) ? json.url : null;
    }).catch(function(){
      return null;
    }).finally(function(){
      if(timer) clearTimeout(timer);
    });
  }

  var STATUS_ORDER = ["送った", "相談してるみたい", "決まった！", "別のところで決まった", "見送り"];
  var STATUS_COUNTED_AS_REFERRED = ["相談してるみたい", "決まった！", "別のところで決まった", "見送り"];

  function uid(prefix){
    return prefix + "_" + Math.random().toString(36).slice(2, 9);
  }

  function getLinkBase(){
    if(location.protocol === "file:"){
      return PUBLIC_BASE;
    }
    return location.origin + location.pathname;
  }

  function getManualLink(){
    var base = getLinkBase().replace(/index\.html$/, "");
    if(base.slice(-1) !== "/") base += "/";
    return base + "manual.html";
  }

  // ---------- base64url（日本語対応・オブジェクト用） ----------
  function encodeSupporterParam(obj){
    return encodeTextParam(JSON.stringify(obj));
  }

  function decodeSupporterParam(str){
    return JSON.parse(decodeTextParam(str));
  }

  // ---------- base64url（日本語対応・文字列用。&by= のような単純な文字列に使う） ----------
  function encodeTextParam(text){
    var bytes = new TextEncoder().encode(text);
    var binary = "";
    for(var i=0;i<bytes.length;i++){
      binary += String.fromCharCode(bytes[i]);
    }
    var b64 = btoa(binary);
    return b64.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  function decodeTextParam(str){
    var b64 = str.replace(/-/g, "+").replace(/_/g, "/");
    while(b64.length % 4 !== 0){
      b64 += "=";
    }
    var binary = atob(b64);
    var bytes = new Uint8Array(binary.length);
    for(var i=0;i<binary.length;i++){
      bytes[i] = binary.charCodeAt(i);
    }
    return new TextDecoder().decode(bytes);
  }

  function loadData(){
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      try{
        var parsed = JSON.parse(raw);
        // v1データからの引き継ぎ: 無い項目だけ補う（消さない）
        if(parsed.role === undefined) parsed.role = null;
        if(!parsed.supporters) parsed.supporters = [];
        if(!parsed.referrals) parsed.referrals = [];
        if(parsed.myCard === undefined) parsed.myCard = null;
        return parsed;
      }catch(e){
        // 破損データは初期化する
      }
    }
    var initial = {
      role: null,
      supporters: [],
      referrals: [],
      myCard: null
    };
    saveData(initial);
    return initial;
  }

  function saveData(data){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  var data = loadData();

  function findSupporter(id){
    for(var i=0;i<data.supporters.length;i++){
      if(data.supporters[i].id === id) return data.supporters[i];
    }
    return null;
  }

  function findReferral(id){
    for(var i=0;i<data.referrals.length;i++){
      if(data.referrals[i].id === id) return data.referrals[i];
    }
    return null;
  }

  function escapeHtml(str){
    var div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  // ---------- トースト ----------
  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){
      toastEl.classList.remove("show");
    }, 2400);
  }

  function copyText(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        showToast("コピーしました");
      }).catch(function(){
        showToast("コピーできませんでした");
      });
    }else{
      showToast("コピーできませんでした");
    }
  }

  // ---------- 画面切替 ----------
  var views = document.querySelectorAll(".view");
  function showView(id){
    views.forEach(function(v){

  function statusMeta(status){
    switch(status){
      case "決まった！": return { emoji: "🎉", cls: "done" };
      case "相談してるみたい": return { emoji: "💬", cls: "" };
      case "別のところで決まった": return { emoji: "🙏", cls: "" };
      case "見送り": return { emoji: "—", cls: "" };
      default: return { emoji: "📤", cls: "" };
    }
  }

  function renderReferralRecords(){
    var wrap = document.getElementById("referral-records");
    if(data.referrals.length === 0){
      wrap.innerHTML = '<div class="empty">まだ紹介の記録がありません</div>';
      return;
    }
    wrap.innerHTML = "";
    var sorted = data.referrals.slice().sort(function(a,b){
      return new Date(b.createdAt) - new Date(a.createdAt);
    });
    sorted.forEach(function(r){
      var supporter = findSupporter(r.supporterId);
      var meta = statusMeta(r.status);
      var item = document.createElement("div");
      item.className = "record-item" + (r.status === "決まった！" ? " celebrate" : "");
      var dateStr = new Date(r.createdAt).toLocaleString("ja-JP", {month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit"});
      var nameLine = supporter ? escapeHtml(supporter.name) : "不明";
      if(r.friendName){
        nameLine += " → " + escapeHtml(r.friendName) + "さん";
      }
      var badgeClass = "status-badge" + (meta.cls ? " " + meta.cls : "");
      item.innerHTML =
        '<div class="top"><strong>' + nameLine + '</strong>' +
        '<span class="' + badgeClass + '">' + meta.emoji + " " + escapeHtml(r.status) + '</span></div>' +
        '<div class="meta">' + dateStr + '</div>';
      if(r.status === "決まった！"){
        var celebrate = document.createElement("div");
        celebrate.className = "celebrate-msg";
        celebrate.textContent = "🎉 よかったね！紹介してくれてありがとう";
        item.appendChild(celebrate);
      }

      var select = document.createElement("select");
      select.className = "status-select";
      STATUS_ORDER.forEach(function(st){
        var opt = document.createElement("option");
        opt.value = st;
        opt.textContent = statusMeta(st).emoji + " " + st;
        if(st === r.status) opt.selected = true;
        select.appendChild(opt);
      });
      select.addEventListener("change", function(){
        updateReferralStatus(r.id, select.value);
      });
      item.appendChild(select);
      wrap.appendChild(item);
    });
  }

  function updateReferralStatus(referralId, newStatus){
    var r = findReferral(referralId);
    if(!r) return;
    var supporter = findSupporter(r.supporterId);
    r.status = newStatus;

    var isCountedAsReferred = STATUS_COUNTED_AS_REFERRED.indexOf(newStatus) !== -1;
    if(supporter && isCountedAsReferred && !r.countedReferred){
      supporter.referredCount += 1;
      r.countedReferred = true;
    }

    if(supporter && newStatus === "決まった！" && !r.countedDecided){
      supporter.decidedCount += 1;
      r.countedDecided = true;
    }

    saveData(data);
    renderReferralRecords();
    if(data.role === "refer") renderReferList();
    renderReceivedList();
  }

  function openReferDetail(supporterId){
    var s = findSupporter(supporterId);
    if(!s) return;
    currentReferSupporterId = supporterId;
    currentRefId = uid("ref") + Math.random().toString(36).slice(2, 6);
    currentTone = "casual";

    document.getElementById("refer-detail-name").textContent = s.name + "さんを紹介する";
    document.getElementById("f-friend-name").value = "";

      b.classList.toggle("active", b.getAttribute("data-tone") === "casual");
    });
    document.getElementById("btn-refer-share").style.display = (navigator.share ? "block" : "none");
    regeneratePreview();
    fetchReferShortLink(s);
    showView("view-refer-detail");

  function fetchReferShortLink(s){
    var refId = currentRefId;
    var longS = encodeSupporterParam({
      name: s.name, skill: s.skill, area: s.area, comment: s.comment, lineUrl: s.lineUrl
    });
    currentReferShortLinkLoading = true;
    setReferSendButtonsBusy(true);
    shortenLink({ s: longS, ref: refId }).then(function(shortUrl){
      if(currentRefId !== refId) return; // 別の紹介に切り替わっていたら破棄
      currentReferShortLinkLoading = false;
      setReferSendButtonsBusy(false);
      if(shortUrl){
        currentReferShortLink = shortUrl;
        regeneratePreview();
      }
    });
  }

  function setReferSendButtonsBusy(busy){
    ["btn-refer-line", "btn-refer-copy", "btn-refer-share"].forEach(function(id){
      var btn = document.getElementById(id);
      if(!btn) return;
      btn.disabled = busy;
      if(busy){
        btn.setAttribute("data-orig-text", btn.textContent);
        btn.textContent = "準備中…";
      }else{
        var orig = btn.getAttribute("data-orig-text");
        if(orig) btn.textContent = orig;
      }
    });
  }

  // 文面プレビューは名前・トーンを変えるたびに作り直す（編集した内容はその時点で上書きされる簡略仕様）
  function regeneratePreview(){
    var s = findSupporter(currentReferSupporterId);
    if(!s) return;
    var friendName = document.getElementById("f-friend-name").value.trim();
    var link = currentReferShortLink || (getLinkBase() + "?s=" + encodeSupporterParam({
      name: s.name, skill: s.skill, area: s.area, comment: s.comment, lineUrl: s.lineUrl
    }) + "&ref=" + currentRefId);

    var line1;
    if(currentTone === "polite"){
      line1 = friendName ? friendName + "さん、お仕事をお探しと伺いました。" : "お仕事をお探しと伺いました。";
      // 得意分野は文型に差し込まず独立した一文にする（「〜の転職の相談」のような重複を避けるため）
      var line2 = s.name + "さんという、ご相談に乗ってくださる方がいます。";
      var skillLine = s.skill ? s.skill + "を得意とされている方です。\n" : "";
      var text = line1 + "\n" + line2 + "\n" + skillLine + "よろしければ一度お話ししてみてください。\n→ " + link;
      document.getElementById("refer-detail-text").value = text;
      return;
    }

    line1 = friendName ? friendName + "、仕事探してるって言ってたよね。" : "仕事探してるって言ってたよね。";
    var line2c = s.name + "さんって人が相談に乗ってくれるから、よかったら話してみて。";
    var skillLineC = s.skill ? s.skill + "が得意な人。\n" : "";
    var text2 = line1 + "\n" + line2c + "\n" + skillLineC + "知り合いだから安心して大丈夫。\n→ " + link;
    document.getElementById("refer-detail-text").value = text2;
  }

  var btnDistribute = document.getElementById("btn-distribute");
  btnDistribute.addEventListener("click", function(){
    if(!data.myCard){
      showToast("先にカードを作ってください");
      return;
    }
    var c = data.myCard;
    var addParam = encodeSupporterParam({
      name: c.name, skill: c.skill, area: c.area, comment: c.comment, lineUrl: c.lineUrl
    });
    var longLink = getLinkBase() + "?add=" + addParam;

    // 一度短縮したリンクはカードに保存して使い回す（カード内容が変わっていれば取り直す）
    if(c.distributeAddParam === addParam && c.distributeShortUrl){
      document.getElementById("distribute-text").textContent = buildDistributeText(c.distributeShortUrl);
      document.getElementById("distribute-generated").style.display = "block";
      return;
    }

    var origText = btnDistribute.textContent;
    btnDistribute.disabled = true;
    btnDistribute.textContent = "準備中…";
    // 配布リンクの短縮は未対応の可能性がある。失敗時は長いURLのままにする（無理に対応しない）
    shortenLink({ add: addParam }).then(function(shortUrl){
      var link = shortUrl || longLink;
      if(shortUrl){
        data.myCard.distributeAddParam = addParam;
        data.myCard.distributeShortUrl = shortUrl;
        saveData(data);
      }
      document.getElementById("distribute-text").textContent = buildDistributeText(link);
      document.getElementById("distribute-generated").style.display = "block";
      btnDistribute.disabled = false;
      btnDistribute.textContent = origText;
    });
  });

  function renderConsultArea(){
    var wrap = document.getElementById("consult-area");
    var refId = getRefParam();
    var referral = refId ? findReferral(refId) : null;
    var supporter = referral ? findSupporter(referral.supporterId) : null;

    var sResult = getSupporterParam();
    if(!supporter && sResult.value){
      var importedSupporter = sResult.value;
      var already = data.supporters.some(function(s){
        return s.name === importedSupporter.name && s.skill === importedSupporter.skill;
      });
      if(!already){
        importedSupporter = Object.assign({}, importedSupporter, {
          id: uid("sup"), referredCount: 0, decidedCount: 0
        });
        data.supporters.push(importedSupporter);
        saveData(data);
      }
      supporter = importedSupporter;
    }

    if(!supporter){
      wrap.innerHTML = sResult.error
        ? '<div class="empty">リンクが古いようです</div>'
        : '<div class="empty">紹介リンクから開いてください</div>';
      return;
    }

    var byName = getByParam();

    wrap.innerHTML = "";
    var big = document.createElement("div");
    big.className = "card big-card";
    var byHtml = byName ? '<div class="meta">' + escapeHtml(byName) + 'さんからの紹介です</div>' : "";
    big.innerHTML =
      byHtml +
      '<div class="meta">紹介された支援者</div>' +
      "<h2>" + escapeHtml(supporter.name) + "</h2>" +
      '<div class="meta">得意: ' + escapeHtml(supporter.skill) + "</div>" +
      '<div class="meta">対応: ' + escapeHtml(supporter.area) + "</div>" +
      '<div class="comment">「' + escapeHtml(supporter.comment) + '」</div>';

    var lineBtn = document.createElement("button");
    lineBtn.className = "btn btn-primary";
    lineBtn.style.marginTop = "14px";
    lineBtn.textContent = "LINEで相談する";
    lineBtn.addEventListener("click", function(){
      if(supporter.lineUrl){
        window.open(supporter.lineUrl, "_blank");
      }else{
        showToast("LINE連絡先が未設定です");
      }
      if(referral) updateReferralStatus(referral.id, "相談してるみたい");
    });
    big.appendChild(lineBtn);

    var hint = document.createElement("div");
    hint.className = "hint";
    hint.style.marginTop = "16px";
    hint.textContent = "決まったら紹介してくれた人に教えてあげてね";
    big.appendChild(hint);

    var doneBtn = document.createElement("button");
    doneBtn.className = "btn btn-secondary btn-small";
    doneBtn.style.marginTop = "8px";
    doneBtn.textContent = "決まった！を送る";
    doneBtn.addEventListener("click", function(){
      if(referral){
        updateReferralStatus(referral.id, "決まった！");
      }
      showToast("紹介してくれた人に伝えました（試作なので画面内だけ）");
    });
    big.appendChild(doneBtn);

    wrap.appendChild(big);
  }

  // ---------- データ全消去（confirmは使わず2度押し） ----------
  function wireResetButton(btn, armedGetter, armedSetter){
    btn.addEventListener("click", function(){
      if(!armedGetter()){
        armedSetter(true);
        btn.textContent = "もう一度押すと全消去します";
        setTimeout(function(){
          armedSetter(false);
          btn.textContent = "データ全消去";
        }, 4000);
        return;
      }
      localStorage.removeItem(STORAGE_KEY);
      armedSetter(false);
      btn.textContent = "データ全消去";
      data = loadData();
      showView("view-role");
      showToast("データを初期化しました");
    });
  }
  wireResetButton(document.getElementById("btn-reset"),
    function(){ return resetArmed; }, function(v){ resetArmed = v; });
  wireResetButton(document.getElementById("btn-reset-2"),
    function(){ return resetArmed2; }, function(v){ resetArmed2 = v; });

  // ============================================================
  // 初期化: 起動時の分岐（1. ?s= 2. ?add= 3. 役割未設定 4. 役割のホーム）
  // ============================================================
  function init(){
    var params = new URLSearchParams(location.search);

    if(params.get("s") || (params.get("ref") && findReferral(params.get("ref")))){
      renderConsultArea();
      showView("view-consult");
      return;
    }

    if(params.get("add")){
      var addResult = getAddParam();
      if(addResult.value){
        showAddConfirm(addResult.value);
        return;
      }
      if(addResult.error){
        showToast("リンクが壊れているようです");
      }
    }

    if(!data.role){
      showView("view-role");
      return;
    }

    if(data.role === "refer"){
      openReferHome();
    }else{
      openSupportHome();
    }
  }

  init();
})();
</script>
</body>
</html>
