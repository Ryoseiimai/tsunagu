name: Tsunagu
options:
  bundleIdPrefix: com.ryoseiworld
  deploymentTarget:
    iOS: '17.0'
targets:
  Tsunagu:
    type: application
    platform: iOS
    sources: [Tsunagu]
    dependencies:
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryoseiworld.tsunagu
        SWIFT_VERSION: '5.0'
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '2'
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: X72629Z4T6
        CODE_SIGN_STYLE: Automatic
    info:
      path: Tsunagu/Info.plist
      properties:
        CFBundleDisplayName: つなぐ
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: com.ryoseiworld.tsunagu.referral
            CFBundleURLSchemes: [tsunagu]
    scheme:
      gatherCoverageData: false
