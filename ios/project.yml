name: Tsunagu
options:
  bundleIdPrefix: com.ryoseiworld
  deploymentTarget:
    iOS: '17.0'
targets:
  Tsunagu:
    type: application
    platform: iOS
    sources: [Tsunagu]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryoseiworld.tsunagu
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: X72629Z4T6
        CODE_SIGN_STYLE: Automatic
    info:
      path: Tsunagu/Info.plist
      properties:
        CFBundleDisplayName: つなぐ
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.ryoseiworld.tsunagu.referral
            CFBundleURLSchemes: [tsunagu]
    scheme:
      gatherCoverageData: false
